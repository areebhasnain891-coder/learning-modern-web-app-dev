    <main>

        <b><i><h1>📞Contact Us📞</h1></i></b>

       <em> <p>
            ❗Have any questions❓ Contact Food Haven Restaurant.❗
        </p></em>

        <form>

            <label for="name">Name📛:</label>
            <br>

            <input type="text" id="name" name="name">

            <br><br>

            <label for="email">Email📩:</label>
            <br>

            <input type="email" id="email" name="email">

            <br><br>

            <label for="phone">Phone📞:</label>
            <br>

            <input type="tel" id="phone" name="phone">

            <br><br>

            <label for="subject">Subject📑:</label>
            <br>

            <input type="text" id="subject" name="subject">

            <br><br>

            <label>Gender🧒:</label>
            <br>

            <input type="radio"
                   id="male"
                   name="gender"
                   value="Male">

            <label for="male">Male</label>

            <br>

            <input type="radio"
                   id="female"
                   name="gender"
                   value="Female">

            <label for="female">Female</label>

            <br><br>

            <label for="food">
                Food Preference🍕🥙:
            </label>

            <br>

            <select id="food" name="food">

                <option value="vegetarian">
                    Vegetarian
                </option>

                <option value="non-vegetarian">
                    Non-Vegetarian
                </option>

            </select>

            <br><br>

            <label for="message">
                Message📝:
            </label>

            <br>

            <textarea id="message"
                      name="message"
                 rows="6"
                      cols="35"></textarea>

            <br><br>

            <button type="submit">
                Submit
            </button>

        </form>

        <hr>

        <i><h2>☎Contact Information☎</h2></i>

        <p>
            Email📑:
            <a href="mailto:foodhaven@example.com">
                foodhaven@example.com
            </a>
        </p>

        <p>
            Phone📞:
            <a href="tel:+923001234567">
                +92 300 1234567
            </a>
        </p>
